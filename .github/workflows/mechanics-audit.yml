name: Ascendance mechanics audit
on:
  pull_request:
  push:
    branches: [testing/mechanics-audit-33621, fix/mechanics-audit-33621, fix/downtime-snare-sync, fix/resource-cooldown-rollback, fix/blight-encounter-effects]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mechanics-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Foundation simulator (replacement runner)
        id: legacy_sim
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p test-results
          npm test 2>&1 | tee "$RUNNER_TEMP/ascendance-foundation.log"
      - name: Browser stability and mechanics (shared full runner)
        id: mechanics
        continue-on-error: true
        run: npm run stability:33621
      - name: Full effect coverage gate
        id: coverage
        continue-on-error: true
        if: always()
        run: npm run audit:coverage
      - name: Generate audit report
        if: always()
        env:
          SIM: ${{ steps.legacy_sim.outcome }}
          STABILITY: ${{ steps.mechanics.outcome }}
          MECHANICS: ${{ steps.mechanics.outcome }}
          COVERAGE: ${{ steps.coverage.outcome }}
        run: |
          mkdir -p test-results
          cp "$RUNNER_TEMP/ascendance-foundation.log" test-results/foundation.log
          node tests/audit/report.cjs test-results/results.json
          node -e "require('fs').writeFileSync('test-results/check-outcomes.json', JSON.stringify({foundation:process.env.SIM,stability:process.env.STABILITY,mechanics:process.env.MECHANICS,coverage:process.env.COVERAGE},null,2))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mechanics-audit
          path: |
            audit/
            test-results/
            playwright-report/
      - name: Preserve failing gate status
        if: always()
        env:
          SIM: ${{ steps.legacy_sim.outcome }}
          STABILITY: ${{ steps.mechanics.outcome }}
          MECHANICS: ${{ steps.mechanics.outcome }}
          COVERAGE: ${{ steps.coverage.outcome }}
        run: test "$SIM" = success && test "$STABILITY" = success && test "$MECHANICS" = success && test "$COVERAGE" = success
