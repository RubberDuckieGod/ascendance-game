name: Workbook card and status review
on:
  pull_request:
    paths:
      - '**status*33627.js'
      - '**mechanics-rules-33621.js'
      - '**mechanics-runtime-33621.js'
      - '**equipment-loot-parity-33612.js'
      - 'tests/audit/focus-tonic-33629.spec.cjs'
      - 'tests/audit/phoenix-effects-33629.spec.cjs'
      - 'tests/audit/consumable-damage-33629.spec.cjs'
      - 'tests/audit/harmful-card-consumers-33629.spec.cjs'
      - 'tests/audit/stamina-actions-33629.spec.cjs'
      - 'tests/stamina-actions-33629-rules.test.cjs'
      - '**hero-card-parity-33611.js'
      - '**hero-runtime-parity-3362.js'
      - '**level-progression-3360.js'
      - '**reputation-3360.js'
      - 'tests/focus-tonic-33629-rules.test.cjs'
      - 'tests/audit/*evidence.cjs'
      - 'tests/audit/coverage.cjs'
      - 'audit/effect-contracts.json'
      - '**status-reference-33628.js'
      - '**workbook-parity-runtime-33628.js'
      - 'tests/audit/workbook-consumers-33628.spec.cjs'
      - 'tests/audit/healing-status-33628.spec.cjs'
      - '**healing-summons*33627.js'
      - 'tests/audit/generic-status-consumers-33627.spec.cjs'
      - 'tests/audit/nature-blessing-33627.spec.cjs'
      - 'tests/audit/workbook-source-review-33628.spec.cjs'
      - 'audit/workbook-reference-v10.52.json'
      - '.github/workflows/workbook-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workbook-review-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/audit/run-foundation-evidence.cjs
      - name: Actual status/card consumers and full reference metadata
        run: PLAYWRIGHT_JSON_OUTPUT_NAME=test-results/effect-browser.json npx playwright test tests/audit/generic-status-consumers-33627.spec.cjs tests/audit/nature-blessing-33627.spec.cjs tests/audit/workbook-source-review-33628.spec.cjs tests/audit/workbook-consumers-33628.spec.cjs tests/audit/healing-status-33628.spec.cjs tests/audit/focus-tonic-33629.spec.cjs tests/audit/phoenix-effects-33629.spec.cjs tests/audit/consumable-damage-33629.spec.cjs tests/audit/harmful-card-consumers-33629.spec.cjs tests/audit/stamina-actions-33629.spec.cjs --reporter=list,json
      - name: Turret solo and native room controls
        run: npx playwright test tests/audit/healing-summons-33627.spec.cjs --grep 'Turret:' --reporter=list
      - name: Record current-source full-effect evidence
        run: node tests/audit/effect-evidence.cjs
      - name: Report remaining full-effect coverage
        continue-on-error: true
        run: npm run audit:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbook-review
          path: test-results/
